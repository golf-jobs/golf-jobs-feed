name: Master Golf Jobs Pipeline

on:
  schedule:
    - cron: "0 3 * * *"      # Runs once daily at 03:00 UTC
  workflow_dispatch:          # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-feeds
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Club Database
        uses: actions/cache@v3
        with:
          path: clubs.db
          key: ${{ runner.os }}-sqlite-db-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sqlite-db-v2-

      - name: Create Public Folder
        run: mkdir -p public

      - name: Run Enterprise Aggregator
        run: python3 feed_generator.py --out public/feed.xml

      - name: Run Global Club Crawler & AI Parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 club_crawler.py
          
      - name: Upload Master Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
