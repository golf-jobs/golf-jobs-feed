name: build-golf-feed

# Runs the feed generator in GitHub's cloud on a schedule and publishes
# feed.xml to GitHub Pages. Nothing runs on your machine.

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC daily (run before JBoard's daily pull)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        run: |
          mkdir -p public
          python3 feed_generator.py --config sources.json --out public/feed.xml
          python3 feed_generator.py --config sources.json --out public/feed.xml --gzip
          echo "Feed lines: $(wc -l < public/feed.xml)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
