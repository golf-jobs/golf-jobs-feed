name: Independent Clubs Feed

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Cache Club Database
        uses: actions/cache@v3
        with:
          path: clubs.db
          key: ${{ runner.os }}-sqlite-db-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sqlite-db-v2-
            
      - name: Create Public Folder
        run: mkdir -p public
        
      - name: Preserve Enterprise Feed (If Exists)
        run: curl -sSf https://golf-jobs.github.io/golf-jobs-feed/feed.xml -o public/feed.xml || echo "No enterprise feed yet"
        
      - name: Run Global Club Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 club_crawler.py
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
