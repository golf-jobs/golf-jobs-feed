name: build-independent-clubs-feed

on:
  schedule:
    - cron: "0 4 * * *"      # Runs daily at 04:00 UTC (before JBoard pulls)
  workflow_dispatch:          # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-clubs
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Database
        uses: actions/cache@v3
        with:
          path: clubs.db
          key: ${{ runner.os }}-sqlite-db-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sqlite-db-v2-

      - name: Run Global Club Crawler & AI Parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          python3 club_crawler.py
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
